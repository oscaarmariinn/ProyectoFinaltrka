<div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content trka-modal">

      <div class="modal-header border-0">
        <h5 class="modal-title">
          {{ selectedEvent?.title }}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        @if (selectedEvent) {
        <img src="../../../../imgs/eventosimgs/{{ selectedEvent.categories[0].img }}.jpg" class="img-fluid rounded mb-3"
          alt="La imagen de la categoría preterminada es {{ selectedEvent.categories[0].name }}">

        <p class="mb-1">📍 {{ selectedEvent.location }}</p>
        <p class="mb-0">📅 {{ selectedEvent.event_date }}</p>
        }

      </div>

    </div>
  </div>
</div>
