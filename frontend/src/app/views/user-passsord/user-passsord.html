<section class="hero hero--small">
  <h1 style="color: var(--blanco-suave);">Cambiar <span style="color: var(--rosa-neon);">contraseña</span></h1>
</section>

<main>
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="feature-card p-4">
          <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label class="form-label">Contraseña actual</label>
              <input type="password" class="form-control" formControlName="currentPassword"
                     placeholder="Contraseña actual...">
            </div>

            <div class="mb-3">
              <label class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" formControlName="newPassword"
                     placeholder="Mínimo 6 caracteres...">
            </div>

            <div class="mb-4">
              <label class="form-label">Confirmar nueva contraseña</label>
              <input type="password" class="form-control" formControlName="confirmPassword"
                     placeholder="Repite la nueva contraseña...">
            </div>

            @if (successMessage) {
              <div class="alert alert-success">{{ successMessage }}</div>
            }

            @if (errorMessage) {
              <div class="alert alert-danger">{{ errorMessage }}</div>
            }

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark fw-bold" [disabled]="loading()">
                {{ loading() ? 'Guardando...' : 'Guardar cambios' }}
              </button>
            </div>

          </form>

          <br>
          <a style="cursor: pointer;" routerLink="/user" routerLinkActive="active">
            Volver al perfil
          </a>

        </div>
      </div>
    </div>
  </section>
</main>
