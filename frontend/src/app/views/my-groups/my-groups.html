<div class="container my-5">

  @if(loading) {
    <p style="color: white;">Cargando...</p>
  }

  @if(!loading && groups.length === 0) {
    <p style="color: white;">No has creado ningún grupo todavía.</p>
  }

  <div class="row g-4">
    @for(group of groups; track $index) {
      <div class="col-md-6">
        <div class="card trka-card h-100" style="background: rgba(26, 26, 64, 0.8);">
          <div class="card-body d-flex flex-column" style="color: var(--blanco-suave);">
            <h5 class="card-title">{{ group.name }}</h5>
            @if(group.is_private) {
              <h6 class="card-text">Privado</h6>
            } @else {
              <h6 class="card-text">Público</h6>
            }
            <p class="card-text">{{ group.description }}</p>
            <button class="btn trka-btn mt-auto" data-bs-toggle="modal" data-bs-target="#eventModal"
                    (click)="selectGroup(group)">
              Ver más
            </button>
            <button [routerLink]="['/groups/edit', group.id]" routerLinkActive="active" class="btn trka-btn mt-2">
              Editar
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
