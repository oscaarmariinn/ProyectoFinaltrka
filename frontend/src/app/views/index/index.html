<section class="hero" [ngStyle]="{
    'background':
    'linear-gradient(rgb(142 45 226 / 50%), rgb(142 45 226 / 80%)), url(' + currentImage + ')'
    }">
    <h1>Conecta. Sal. Disfruta.</h1>

    <p>
        Descubre los mejores planes en Valencia. Fiestas,
        eventos y nuevas amistades — todo en una sola app.
    </p>


    <a class="cta-btn" routerLink="/register" >
        Únete ahora
    </a>

</section>

                <h5 class="mt-3">Evento 1</h5>

                    Aquí va la descripción.
